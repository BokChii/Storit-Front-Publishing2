<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>스토릿 - 퀴즈 풀기</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
    <link rel="stylesheet" href="assets/base.css" />
    <link rel="stylesheet" href="assets/quiz.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="assets/frame-scale.js"></script>
  </head>
  <body>
    <div class="frame qz-page">
      <div class="qz-body"></div>

      <!-- 상단바 -->
      <header class="qz-topbar">
        <button type="button" class="qz-back" aria-label="뒤로">
          <svg width="24" height="24" viewBox="5.5 0 24 24" fill="none">
            <path
              d="M15 4.5 7.5 12 15 19.5"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <h1 class="qz-title">66666년 만에 환생한 흑마법사</h1>
      </header>

      <!-- 진행바 -->
      <div class="qz-progress">
        <div class="qz-progress-track">
          <div class="qz-progress-fill"></div>
        </div>
        <div class="qz-progress-label">
          <span class="cur">1</span> / <span class="qz-total">5</span>문항
        </div>
      </div>

      <!-- 문제 카드 (내용은 quiz.js 가 문항마다 채움) -->
      <section class="qz-card">
        <div class="qz-q">
          <div class="qz-q-num"></div>

          <!-- 유저 제작 퀴즈일 때만 표시 -->
          <div class="qz-badge" hidden><span class="qz-badge-text"></span></div>

          <div class="qz-q-text"></div>

          <div class="qz-chips">
            <span class="qz-chip qz-chip-timer">
              <svg viewBox="0 0 18 18" fill="none" aria-hidden="true">
                <circle cx="9" cy="9.75" r="6.75" stroke="#EF9F27" stroke-width="1.8" />
                <path d="M9 6.5v3.25" stroke="#EF9F27" stroke-width="1.8" stroke-linecap="round" />
              </svg>
              <span class="qz-timer"></span>
            </span>
          </div>

          <div class="qz-chips-right">
            <span class="qz-chip qz-ep"></span>
            <button type="button" class="qz-chip qz-chip-link">보러가기</button>
          </div>
        </div>

        <div class="qz-options"></div>
      </section>

      <!-- 하단 장식: 노란 원 스캘럽 + 쿠키 마스코트 -->
      <div class="qz-scallop">
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <img class="qz-mascot" src="assets/quiz_cookie.svg" alt="" />

      <!-- 첫 진입 튜토리얼 코치 -->
      <div class="qz-coach" hidden>
        <svg class="qz-dim" viewBox="0 0 375 812" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <mask id="qz-holes">
              <rect x="-2000" y="-2000" width="4000" height="4000" fill="#fff" />
              <rect x="27" y="280.5" width="80" height="48" rx="10" fill="#000" />
              <rect x="218" y="280.5" width="130" height="48" rx="10" fill="#000" />
            </mask>
          </defs>
          <rect x="-2000" y="-2000" width="4000" height="4000" fill="rgba(28,16,0,0.8)" mask="url(#qz-holes)" />
        </svg>
        <div class="qz-ring qz-ring--timer"></div>
        <div class="qz-ring qz-ring--link"></div>
        <div class="qz-tip qz-tip--timer">퀴즈마다 30초 제한!</div>
        <div class="qz-tip qz-tip--link">누르면 웹툰으로 이동</div>

        <div class="qz-sheet">
          <span class="qz-sheet-handle"></span>

          <div class="qz-sheet-body">
            <div class="qz-sheet-copy">
              <p class="qz-sheet-title">웹툰마다 5개 문제<br />30초 안에 풀어야해요!</p>
              <p class="qz-sheet-desc">
                제한 시간 안에 빠르게 풀수록 더 높은 점수를 받을 수 있어요. 시간 안에 답을 선택하지
                못하면 오답 처리돼요.
              </p>
            </div>
            <img class="qz-sheet-mascot" src="assets/quiz_mascot.svg" alt="" />
          </div>

          <button type="button" class="qz-sheet-cta">문제 풀기</button>
        </div>
      </div>

      <!-- 이탈 확인 모달 (뒤로가기) -->
      <div class="qz-exit" hidden>
        <button type="button" class="qz-exit-overlay" aria-label="닫기"></button>
        <div class="qz-exit-card" role="dialog" aria-modal="true" aria-labelledby="qz-exit-title">
          <button type="button" class="qz-exit-close" aria-label="닫기">
            <svg viewBox="0 0 18 18" fill="none">
              <path d="M4 4l10 10M14 4L4 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
          </button>

          <div class="qz-exit-icon">
            <svg viewBox="0 0 50 50" fill="none" aria-hidden="true">
              <path d="M25 12v18" stroke="#EF9F27" stroke-width="6" stroke-linecap="round" />
              <circle cx="25" cy="39" r="3.5" fill="#EF9F27" />
            </svg>
          </div>

          <div class="qz-exit-text">
            <h2 id="qz-exit-title" class="qz-exit-title">
              퀴즈를 푸는 중입니다.<br />정말 나가시겠습니까?
            </h2>
            <p class="qz-exit-desc">
              완료하지 않고 페이지를 벗어날 경우,<br />현재까지 맞춘 퀴즈로 계산됩니다.
            </p>
          </div>

          <div class="qz-exit-actions">
            <button type="button" class="qz-exit-btn qz-exit-leave">이동하기</button>
            <button type="button" class="qz-exit-btn qz-exit-stay">계속풀기</button>
          </div>
        </div>
      </div>

      <!-- 자정 도달 안내 팝업: 내부 콘텐츠는 별도 디자인 확정 후 추가 -->
      <div class="qz-midnight" hidden>
        <button type="button" class="qz-midnight-overlay" aria-label="팝업 닫기"></button>
        <div class="qz-midnight-card" role="dialog" aria-modal="true" aria-label="자정 안내">
          <button type="button" class="qz-midnight-close" aria-label="닫기">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M9.00166 10.5917L12.9789 14.569C13.19 14.78 13.4762 14.8986 13.7747 14.8986C14.0731 14.8986 14.3594 14.78 14.5704 14.569C14.7815 14.3579 14.9 14.0717 14.9 13.7732C14.9 13.4747 14.7815 13.1885 14.5704 12.9775L10.5917 9.0002L14.5697 5.02295C14.6741 4.91846 14.757 4.79441 14.8135 4.65789C14.87 4.52137 14.899 4.37506 14.899 4.22731C14.899 4.07956 14.8698 3.93327 14.8133 3.79678C14.7567 3.66029 14.6738 3.53628 14.5693 3.43183C14.4648 3.32738 14.3407 3.24453 14.2042 3.18803C14.0677 3.13152 13.9214 3.10245 13.7736 3.10248C13.6259 3.10252 13.4796 3.13166 13.3431 3.18823C13.2066 3.2448 13.0826 3.32771 12.9782 3.4322L9.00166 7.40945L5.02441 3.4322C4.92068 3.32471 4.79658 3.23895 4.65936 3.17992C4.52213 3.1209 4.37452 3.08979 4.22515 3.08843C4.07577 3.08706 3.92762 3.11545 3.78933 3.17195C3.65105 3.22845 3.5254 3.31193 3.41972 3.41751C3.31405 3.52309 3.23045 3.64866 3.17382 3.78689C3.11719 3.92512 3.08865 4.07324 3.08988 4.22262C3.09111 4.372 3.12207 4.51963 3.18097 4.65692C3.23986 4.7942 3.32551 4.91838 3.43291 5.0222L7.41166 9.0002L3.43366 12.9782C3.32626 13.082 3.24061 13.2062 3.18172 13.3435C3.12282 13.4808 3.09186 13.6284 3.09063 13.7778C3.0894 13.9272 3.11794 14.0753 3.17457 14.2135C3.2312 14.3518 3.31479 14.4773 3.42047 14.5829C3.52615 14.6885 3.6518 14.772 3.79008 14.8285C3.92837 14.885 4.07652 14.9134 4.2259 14.912C4.37527 14.9106 4.52288 14.8795 4.66011 14.8205C4.79733 14.7615 4.92143 14.6757 5.02516 14.5682L9.00166 10.5917Z" fill="#888880" fill-opacity="0.8"/>
            </svg>
          </button>
          <div class="qz-midnight-art" aria-hidden="true">
            <div class="qz-midnight-icon">
              <svg viewBox="0 0 50 50" fill="none">
                <path d="M25 12.5C16.99 12.5 10.5 19 10.5 27S16.99 41.5 25 41.5 39.5 35.01 39.5 27 33.01 12.5 25 12.5ZM25 33.75C24.27 33.75 23.67 34.35 23.67 35.08S24.27 36.42 25 36.42 26.33 35.82 26.33 35.08 25.73 33.75 25 33.75ZM25 18.5C21.69 18.5 19 21.19 19 24.5c0 .73.6 1.33 1.33 1.33s1.34-.6 1.34-1.33A3.33 3.33 0 0 1 25 21.17c1.35 0 2.5.8 3.03 1.96a3.3 3.3 0 0 1-1.8 4.45c-1.38.55-2.56 1.83-2.56 3.42v.42c0 .73.6 1.33 1.33 1.33s1.33-.6 1.33-1.33V31c0-.41.18-.7.62-.92a5.9 5.9 0 0 0 3.3-6.7A6.6 6.6 0 0 0 25 18.5Z" fill="#EF9F27"/>
              </svg>
            </div>
            <img src="assets/cookie_times_up_color.svg" alt="" />
          </div>
          <h2 class="qz-midnight-title">오늘의 퀴즈가 종료되었어요</h2>
          <p class="qz-midnight-description">
            자정이 되어 오늘의 퀴즈가 마감되었어요.<br />
            현재까지 풀어온 결과를 반영해<br />
            결과 화면으로 이동합니다.
          </p>
          <button type="button" class="qz-midnight-result">결과 보기</button>
          <div class="qz-midnight-note">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M0.898438 7.63757C0.898437 8.52256 1.07275 9.39889 1.41142 10.2165C1.7501 11.0342 2.2465 11.7771 2.87228 12.4029C3.49807 13.0286 4.24099 13.525 5.05861 13.8637C5.87624 14.2024 6.75257 14.3767 7.63757 14.3767C8.52256 14.3767 9.39889 14.2024 10.2165 13.8637C11.0342 13.525 11.7771 13.0286 12.4029 12.4029C13.0286 11.7771 13.525 11.0342 13.8637 10.2165C14.2024 9.39889 14.3767 8.52256 14.3767 7.63757C14.3767 5.85024 13.6667 4.13612 12.4029 2.87228C11.139 1.60845 9.4249 0.898437 7.63757 0.898438C5.85024 0.898437 4.13612 1.60845 2.87228 2.87228C1.60845 4.13612 0.898438 5.85024 0.898438 7.63757Z" stroke="#5D3300" stroke-width="1.7971" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M7.63672 3.89355V7.63752L9.8831 9.88389" stroke="#5D3300" stroke-width="1.7971" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>잠시 후 자동으로 이동해요</span>
          </div>
        </div>
      </div>
    </div>

    <script src="assets/quiz.js"></script>
  </body>
</html>
